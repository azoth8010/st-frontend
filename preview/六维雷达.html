<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六维雷达 · 悬浮球图标</title>
<style>
:root{--surface:#f9f1df;--surface-raised:#f3e8d2;--border:#dcc9a5;--border-strong:#c8c3b1;
--text-primary:#352722;--text-secondary:#756342;--serif:"Noto Serif SC","Songti SC",serif;
--sans:-apple-system,"Noto Sans SC","PingFang SC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#e6dcc8;font-family:var(--sans);color:var(--text-primary);
 padding:24px 16px;display:flex;justify-content:center}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border-strong);
 border-radius:8px;padding:16px 18px;box-shadow:0 14px 30px -22px rgba(0,0,0,.5)}
h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--text-secondary);letter-spacing:1px;
 border-bottom:1px solid var(--border);padding-bottom:4px}
.radar{display:flex;justify-content:center;margin:8px 0 0}
.radar svg{width:100%;max-width:260px;height:auto;overflow:visible}
.axis{stroke:var(--border);stroke-width:1}
.ring{fill:none;stroke:var(--border);stroke-width:1}
.ring.is-outer{stroke:var(--border-strong)}
.shape{fill:rgba(140,90,43,.16);stroke:#8c5a2b;stroke-width:1.6;stroke-linejoin:round}
.dot{fill:#8c5a2b}
.t{font:10px var(--serif);fill:var(--text-secondary)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.c{background:var(--surface-raised);border:1px solid var(--border);border-radius:2px;padding:6px;text-align:center}
.c .n{font-size:11px;color:var(--text-secondary)}
.c .q{font-size:15px;font-weight:600;margin-top:2px}
.ball{position:fixed;right:24px;bottom:24px;width:44px;height:44px;border-radius:50%;
 border:1px solid #ba8e4a;background:#8c5a2b;color:#f9f1df;font-size:20px;line-height:1;
 display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -8px rgba(0,0,0,.55)}
.tip{position:fixed;left:24px;bottom:28px;font:11px var(--sans);color:#7a6a54}
</style></head><body>
<div class="card">
  <h3>六维</h3>
  <div class="radar"><svg viewBox="0 0 240 240" role="img" aria-label="六维属性图"><polygon class="ring" points="120.0,105.6 132.5,112.8 132.5,127.2 120.0,134.4 107.5,127.2 107.5,112.8"/><polygon class="ring" points="120.0,91.2 144.9,105.6 144.9,134.4 120.0,148.8 95.1,134.4 95.1,105.6"/><polygon class="ring" points="120.0,76.8 157.4,98.4 157.4,141.6 120.0,163.2 82.6,141.6 82.6,98.4"/><polygon class="ring" points="120.0,62.4 169.9,91.2 169.9,148.8 120.0,177.6 70.1,148.8 70.1,91.2"/><polygon class="ring is-outer" points="120.0,48.0 182.4,84.0 182.4,156.0 120.0,192.0 57.6,156.0 57.6,84.0"/><line class="axis" x1="120" y1="120" x2="120.0" y2="48.0"/><line class="axis" x1="120" y1="120" x2="182.4" y2="84.0"/><line class="axis" x1="120" y1="120" x2="182.4" y2="156.0"/><line class="axis" x1="120" y1="120" x2="120.0" y2="192.0"/><line class="axis" x1="120" y1="120" x2="57.6" y2="156.0"/><line class="axis" x1="120" y1="120" x2="57.6" y2="84.0"/><polygon class="shape" points="120.0,80.4 157.4,98.4 148.1,136.2 120.0,156.0 91.9,136.2 91.9,103.8"/><circle class="dot" cx="120.0" cy="80.4" r="2.6"/><circle class="dot" cx="157.4" cy="98.4" r="2.6"/><circle class="dot" cx="148.1" cy="136.2" r="2.6"/><circle class="dot" cx="120.0" cy="156.0" r="2.6"/><circle class="dot" cx="91.9" cy="136.2" r="2.6"/><circle class="dot" cx="91.9" cy="103.8" r="2.6"/><text class="t" x="120.0" y="29.0" text-anchor="middle">体魄 <tspan font-weight="600">55</tspan></text><text class="t" x="201.4" y="76.0" text-anchor="start">敏捷 <tspan font-weight="600">60</tspan></text><text class="t" x="201.4" y="170.0" text-anchor="start">学识 <tspan font-weight="600">45</tspan></text><text class="t" x="120.0" y="217.0" text-anchor="middle">洞察 <tspan font-weight="600">50</tspan></text><text class="t" x="38.6" y="170.0" text-anchor="end">意志 <tspan font-weight="600">45</tspan></text><text class="t" x="38.6" y="76.0" text-anchor="end">魅力 <tspan font-weight="600">45</tspan></text></svg></div>
  <div class="grid"><div class="c"><div class="n">体魄</div><div class="q">55</div></div><div class="c"><div class="n">敏捷</div><div class="q">60</div></div><div class="c"><div class="n">学识</div><div class="q">45</div></div><div class="c"><div class="n">洞察</div><div class="q">50</div></div><div class="c"><div class="n">意志</div><div class="q">45</div></div><div class="c"><div class="n">魅力</div><div class="q">45</div></div></div>
</div>
<div class="ball" title="打开迷宫饭面板">🍲</div>
<div class="tip">右下角：改后的胶囊图标</div>
</body></html>
